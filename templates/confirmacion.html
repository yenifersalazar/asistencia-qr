<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asistencia registrada</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f6fb;
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 28px rgba(15, 23, 42, .08);
        }
        .check {
            margin: 0 auto 16px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #dcfce7;
            color: #166534;
            font-size: 32px;
        }
        .id {
            display: block;
            padding: 13px;
            margin-top: 8px;
            border-radius: 8px;
            background: #f1f5f9;
            overflow-wrap: anywhere;
            font-weight: bold;
        }
        p { line-height: 1.5; color: #4b5563; }
    </style>
</head>
<body>
    <main class="card">
        <div class="check" aria-hidden="true">✓</div>
        <h1>¡Asistencia registrada!</h1>
        <p>Gracias, {{ nombre }}. Tu registro se guardó correctamente.</p>
        <p>Tu identificador de asistencia es:</p>
        <span class="id">{{ id_asistencia }}</span>
        <p>Puedes cerrar esta página.</p>
    </main>
</body>
</html>
